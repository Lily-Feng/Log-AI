[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logai"
version = "0.2.0"
description = "Tiered log intelligence: multiline assembly, PCI scrubbing, template mining, exception fingerprinting, baseline breach detection, and gated reaction plans."
requires-python = ">=3.10"
dependencies = ["drain3>=0.9.11"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
aws = ["boto3>=1.28"]
llm = ["anthropic>=0.40"]

[project.scripts]
logai = "logai.cli:main"

[tool.setuptools.packages.find]
include = ["logai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
