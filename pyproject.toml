[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "javalogai"
version = "0.1.0"
description = "Tier-1 deterministic log intelligence for JVM applications: multiline assembly, PCI scrubbing, template mining, exception fingerprinting, and baseline breach detection."
requires-python = ">=3.10"
dependencies = ["drain3>=0.9.11"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
javalogai = "javalogai.cli:main"

[tool.setuptools.packages.find]
include = ["javalogai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
