<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1260" viewBox="0 0 1900 1260"><rect width="100%" height="100%" fill="#fff"/><rect x="60" y="158" width="190" height="42" rx="8" fill="#e9ecef" stroke="#495057" stroke-width="2"/><rect x="60" y="212" width="190" height="42" rx="8" fill="#e9ecef" stroke="#495057" stroke-width="2"/><rect x="60" y="266" width="190" height="42" rx="8" fill="#e9ecef" stroke="#495057" stroke-width="2"/><rect x="60" y="320" width="190" height="42" rx="8" fill="#e9ecef" stroke="#495057" stroke-width="2" stroke-dasharray="8 6"/><rect x="300" y="120" width="1080" height="250" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="322" y="212" width="128" height="74" rx="8" fill="#ffffff" stroke="#495057" stroke-width="2"/><rect x="464" y="212" width="128" height="74" rx="8" fill="#ffffff" stroke="#495057" stroke-width="2"/><rect x="606" y="212" width="128" height="74" rx="8" fill="#ffffff" stroke="#495057" stroke-width="2"/><rect x="748" y="212" width="128" height="74" rx="8" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><rect x="890" y="212" width="128" height="74" rx="8" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><rect x="1032" y="212" width="128" height="74" rx="8" fill="#ffffff" stroke="#495057" stroke-width="2"/><rect x="1174" y="212" width="128" height="74" rx="8" fill="#ffffff" stroke="#495057" stroke-width="2"/><rect x="1424" y="196" width="210" height="96" rx="8" fill="#ffec99" stroke="#f08c00" stroke-width="2"/><rect x="300" y="470" width="520" height="150" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><rect x="322" y="562" width="230" height="42" rx="8" fill="#ffffff" stroke="#495057" stroke-width="2"/><rect x="566" y="562" width="232" height="42" rx="8" fill="#ffffff" stroke="#495057" stroke-width="2"/><rect x="900" y="470" width="480" height="150" rx="8" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><rect x="922" y="562" width="436" height="42" rx="8" fill="#ffffff" stroke="#495057" stroke-width="2"/><rect x="660" y="690" width="360" height="56" rx="8" fill="#ffffff" stroke="#495057" stroke-width="2"/><rect x="300" y="810" width="1080" height="128" rx="8" fill="#ffec99" stroke="#f08c00" stroke-width="2"/><rect x="322" y="858" width="228" height="62" rx="8" fill="#ffffff" stroke="#495057" stroke-width="2"/><rect x="586" y="858" width="228" height="62" rx="8" fill="#ffffff" stroke="#495057" stroke-width="2"/><rect x="850" y="858" width="228" height="62" rx="8" fill="#ffffff" stroke="#495057" stroke-width="2"/><rect x="1114" y="858" width="228" height="62" rx="8" fill="#ffffff" stroke="#495057" stroke-width="2"/><rect x="322" y="978" width="198" height="44" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><rect x="538" y="978" width="198" height="44" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><rect x="754" y="978" width="198" height="44" rx="8" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><rect x="970" y="978" width="198" height="44" rx="8" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><rect x="1186" y="978" width="198" height="44" rx="8" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><rect x="1424" y="470" width="400" height="496" rx="8" fill="#e9ecef" stroke="#495057" stroke-width="2"/><rect x="1444" y="568" width="150" height="40" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="1444" y="622" width="150" height="40" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="1444" y="676" width="150" height="40" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="1444" y="760" width="150" height="40" rx="8" fill="#ffec99" stroke="#f08c00" stroke-width="2"/><rect x="1444" y="814" width="150" height="40" rx="8" fill="#ffec99" stroke="#f08c00" stroke-width="2"/><path d="M 450,249 L 464,249" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><path d="M 592,249 L 606,249" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><path d="M 734,249 L 748,249" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><path d="M 876,249 L 890,249" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><path d="M 1018,249 L 1032,249" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><path d="M 1160,249 L 1174,249" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><path d="M 252,179 L 296,200" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><path d="M 252,233 L 296,208" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><path d="M 252,287 L 296,216" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><path d="M 252,341 L 296,224" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><path d="M 1380,244 L 1420,244" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><path d="M 1620,292 L 1620,412 L 560,412 L 560,464" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><path d="M 820,545 L 896,545" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><path d="M 560,620 L 800,686" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><path d="M 1140,620 L 890,686" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><path d="M 840,746 L 840,806" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><path d="M 840,938 L 840,974" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><path d="M 1519,608 L 1519,622" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><path d="M 1519,662 L 1519,676" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><path d="M 1519,800 L 1519,814" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><text x="60" y="57.0" font-family="Helvetica,Arial" font-size="30" fill="#1e1e1e" text-anchor="start">logai — stages and flow</text><text x="60" y="85.5" font-family="Helvetica,Arial" font-size="15" fill="#5c5f66" text-anchor="start">Each stage costs in proportion to a different denominator. That is the whole design.</text><text x="60" y="143.7" font-family="Helvetica,Arial" font-size="13" fill="#5c5f66" text-anchor="start">SOURCES</text><text x="155.0" y="183.9" font-family="Helvetica,Arial" font-size="14" fill="#1e1e1e" text-anchor="middle">files / stdin</text><text x="155.0" y="237.9" font-family="Helvetica,Arial" font-size="14" fill="#1e1e1e" text-anchor="middle">S3 objects</text><text x="155.0" y="291.9" font-family="Helvetica,Arial" font-size="14" fill="#1e1e1e" text-anchor="middle">CloudWatch Logs</text><text x="155.0" y="345.9" font-family="Helvetica,Arial" font-size="14" fill="#1e1e1e" text-anchor="middle">Kafka / OTel</text><text x="60" y="396.8" font-family="Helvetica,Arial" font-size="12" fill="#868e96" text-anchor="start">dashed = not built yet</text><text x="320" y="153.1" font-family="Helvetica,Arial" font-size="19" fill="#1971c2" text-anchor="start">DETECT — deterministic</text><text x="320" y="175.7" font-family="Helvetica,Arial" font-size="13" fill="#5c5f66" text-anchor="start">CPU only. No network, no model, no tokens.</text><text x="386.0" y="245.425" font-family="Helvetica,Arial" font-size="13" fill="#1e1e1e" text-anchor="middle">Multiline</text><text x="386.0" y="261.675" font-family="Helvetica,Arial" font-size="13" fill="#1e1e1e" text-anchor="middle">assembly</text><text x="528.0" y="245.425" font-family="Helvetica,Arial" font-size="13" fill="#1e1e1e" text-anchor="middle">Header</text><text x="528.0" y="261.675" font-family="Helvetica,Arial" font-size="13" fill="#1e1e1e" text-anchor="middle">parse</text><text x="670.0" y="245.425" font-family="Helvetica,Arial" font-size="13" fill="#1e1e1e" text-anchor="middle">Scrub</text><text x="670.0" y="261.675" font-family="Helvetica,Arial" font-size="13" fill="#1e1e1e" text-anchor="middle">(PAN/PII)</text><text x="812.0" y="245.425" font-family="Helvetica,Arial" font-size="13" fill="#1e1e1e" text-anchor="middle">Exception</text><text x="812.0" y="261.675" font-family="Helvetica,Arial" font-size="13" fill="#1e1e1e" text-anchor="middle">chain</text><text x="954.0" y="253.55" font-family="Helvetica,Arial" font-size="13" fill="#1e1e1e" text-anchor="middle">Fingerprint</text><text x="1096.0" y="245.425" font-family="Helvetica,Arial" font-size="13" fill="#1e1e1e" text-anchor="middle">Template</text><text x="1096.0" y="261.675" font-family="Helvetica,Arial" font-size="13" fill="#1e1e1e" text-anchor="middle">mine</text><text x="1238.0" y="245.425" font-family="Helvetica,Arial" font-size="13" fill="#1e1e1e" text-anchor="middle">Baseline</text><text x="1238.0" y="261.675" font-family="Helvetica,Arial" font-size="13" fill="#1e1e1e" text-anchor="middle">detect</text><text x="322" y="312.8" font-family="Helvetica,Arial" font-size="12" fill="#6741d9" text-anchor="start">purple = JVM enrichment; activates only when there are stack traces, no-ops cleanly otherwise</text><text x="322" y="336.8" font-family="Helvetica,Arial" font-size="12" fill="#5c5f66" text-anchor="start">everything else is format-agnostic — 100% parse on Hadoop, ZooKeeper, Spark, HDFS and OpenStack</text><text x="1442" y="230.0" font-family="Helvetica,Arial" font-size="20" fill="#1e1e1e" text-anchor="start">Signal</text><text x="1442" y="252.8" font-family="Helvetica,Arial" font-size="12" fill="#5c5f66" text-anchor="start">novelty · rate breach</text><text x="1442" y="267.8" font-family="Helvetica,Arial" font-size="12" fill="#5c5f66" text-anchor="start">severity burst</text><text x="1430" y="310.8" font-family="Helvetica,Arial" font-size="12" fill="#868e96" text-anchor="start">the only records</text><text x="1430" y="325.8" font-family="Helvetica,Arial" font-size="12" fill="#868e96" text-anchor="start">that travel further</text><text x="322" y="503.1" font-family="Helvetica,Arial" font-size="19" fill="#2f9e44" text-anchor="start">REACT — playbooks</text><text x="322" y="525.7" font-family="Helvetica,Arial" font-size="13" fill="#5c5f66" text-anchor="start">Pure predicate match. Free, reproducible,</text><text x="322" y="541.95" font-family="Helvetica,Arial" font-size="13" fill="#5c5f66" text-anchor="start">explainable months later.</text><text x="437.0" y="587.55" font-family="Helvetica,Arial" font-size="13" fill="#1e1e1e" text-anchor="middle">10 built-in playbooks</text><text x="682.0" y="587.55" font-family="Helvetica,Arial" font-size="13" fill="#1e1e1e" text-anchor="middle">ranked by specificity</text><text x="922" y="503.1" font-family="Helvetica,Arial" font-size="19" fill="#6741d9" text-anchor="start">EXPLAIN — model fallback</text><text x="922" y="525.7" font-family="Helvetica,Arial" font-size="13" fill="#5c5f66" text-anchor="start">Only signals no playbook matched.</text><text x="922" y="541.95" font-family="Helvetica,Arial" font-size="13" fill="#5c5f66" text-anchor="start">This is the only place tokens are spent.</text><text x="1140.0" y="587.55" font-family="Helvetica,Arial" font-size="13" fill="#1e1e1e" text-anchor="middle">Claude · claude-opus-5</text><text x="824" y="526.8" font-family="Helvetica,Arial" font-size="12" fill="#868e96" text-anchor="start">no match</text><text x="840.0" y="723.95" font-family="Helvetica,Arial" font-size="17" fill="#1e1e1e" text-anchor="middle">ReactionPlan</text><text x="330" y="708.8" font-family="Helvetica,Arial" font-size="12" fill="#868e96" text-anchor="start">hypotheses · evidence</text><text x="330" y="723.8" font-family="Helvetica,Arial" font-size="12" fill="#868e96" text-anchor="start">blast radius · routing</text><text x="330" y="738.8" font-family="Helvetica,Arial" font-size="12" fill="#868e96" text-anchor="start">actions</text><text x="322" y="840.2" font-family="Helvetica,Arial" font-size="18" fill="#f08c00" text-anchor="start">ActionExecutor — four independent gates, all must open</text><text x="436.0" y="885.425" font-family="Helvetica,Arial" font-size="13" fill="#1e1e1e" text-anchor="middle">dry-run</text><text x="436.0" y="901.675" font-family="Helvetica,Arial" font-size="13" fill="#1e1e1e" text-anchor="middle">by default</text><text x="557" y="889.9" font-family="Helvetica,Arial" font-size="11" fill="#f08c00" text-anchor="start">AND</text><text x="700.0" y="885.425" font-family="Helvetica,Arial" font-size="13" fill="#1e1e1e" text-anchor="middle">risk ceiling</text><text x="700.0" y="901.675" font-family="Helvetica,Arial" font-size="13" fill="#1e1e1e" text-anchor="middle">(default: notify)</text><text x="821" y="889.9" font-family="Helvetica,Arial" font-size="11" fill="#f08c00" text-anchor="start">AND</text><text x="964.0" y="885.425" font-family="Helvetica,Arial" font-size="13" fill="#1e1e1e" text-anchor="middle">human approval</text><text x="964.0" y="901.675" font-family="Helvetica,Arial" font-size="13" fill="#1e1e1e" text-anchor="middle">≥ mitigate</text><text x="1085" y="889.9" font-family="Helvetica,Arial" font-size="11" fill="#f08c00" text-anchor="start">AND</text><text x="1228.0" y="885.425" font-family="Helvetica,Arial" font-size="13" fill="#1e1e1e" text-anchor="middle">registered handler</text><text x="1228.0" y="901.675" font-family="Helvetica,Arial" font-size="13" fill="#1e1e1e" text-anchor="middle">for that kind</text><text x="421.0" y="1004.9" font-family="Helvetica,Arial" font-size="14" fill="#1e1e1e" text-anchor="middle">observe</text><text x="637.0" y="1004.9" font-family="Helvetica,Arial" font-size="14" fill="#1e1e1e" text-anchor="middle">notify</text><text x="853.0" y="1004.9" font-family="Helvetica,Arial" font-size="14" fill="#1e1e1e" text-anchor="middle">mitigate</text><text x="1069.0" y="1004.9" font-family="Helvetica,Arial" font-size="14" fill="#1e1e1e" text-anchor="middle">remediate</text><text x="1285.0" y="1004.9" font-family="Helvetica,Arial" font-size="14" fill="#1e1e1e" text-anchor="middle">destructive</text><text x="322" y="1042.8" font-family="Helvetica,Arial" font-size="12" fill="#e03131" text-anchor="start">never auto-executes: model-proposed actions are approval-forced, and an unknown risk parses as destructive</text><text x="1444" y="502.2" font-family="Helvetica,Arial" font-size="18" fill="#1e1e1e" text-anchor="start">Measured</text><text x="1444" y="524.8" font-family="Helvetica,Arial" font-size="12" fill="#868e96" text-anchor="start">full Spark corpus, 2.7 GB</text><text x="1444" y="555.9" font-family="Helvetica,Arial" font-size="11" fill="#868e96" text-anchor="start">VOLUME</text><text x="1519.0" y="593.25" font-family="Helvetica,Arial" font-size="15" fill="#1e1e1e" text-anchor="middle">33,236,604</text><text x="1606" y="590.7" font-family="Helvetica,Arial" font-size="13" fill="#1e1e1e" text-anchor="start">raw lines</text><text x="1519.0" y="647.25" font-family="Helvetica,Arial" font-size="15" fill="#1e1e1e" text-anchor="middle">27,410,255</text><text x="1606" y="644.7" font-family="Helvetica,Arial" font-size="13" fill="#1e1e1e" text-anchor="start">logical events</text><text x="1519.0" y="701.25" font-family="Helvetica,Arial" font-size="15" fill="#1e1e1e" text-anchor="middle">259</text><text x="1606" y="698.7" font-family="Helvetica,Arial" font-size="13" fill="#1e1e1e" text-anchor="start">templates</text><text x="1444" y="747.9" font-family="Helvetica,Arial" font-size="11" fill="#868e96" text-anchor="start">FAILURES</text><text x="1519.0" y="785.25" font-family="Helvetica,Arial" font-size="15" fill="#1e1e1e" text-anchor="middle">8,058</text><text x="1606" y="782.7" font-family="Helvetica,Arial" font-size="13" fill="#1e1e1e" text-anchor="start">events with a trace</text><text x="1519.0" y="839.25" font-family="Helvetica,Arial" font-size="15" fill="#1e1e1e" text-anchor="middle">55</text><text x="1606" y="836.7" font-family="Helvetica,Arial" font-size="13" fill="#1e1e1e" text-anchor="start">distinct failures</text><text x="1444" y="884.8" font-family="Helvetica,Arial" font-size="12" fill="#5c5f66" text-anchor="start">6,326 signals emitted on a cold run;</text><text x="1444" y="899.8" font-family="Helvetica,Arial" font-size="12" fill="#5c5f66" text-anchor="start">a warm run emits far fewer — every</text><text x="1444" y="914.8" font-family="Helvetica,Arial" font-size="12" fill="#5c5f66" text-anchor="start">template is novel exactly once.</text><text x="1444" y="950.8" font-family="Helvetica,Arial" font-size="12" fill="#5c5f66" text-anchor="start">peak RSS 33.5 MB — bounded by templates, not input size</text><text x="60" y="1086.2" font-family="Helvetica,Arial" font-size="18" fill="#1e1e1e" text-anchor="start">Cost model</text><text x="60" y="1116.6" font-family="Helvetica,Arial" font-size="14" fill="#1971c2" text-anchor="start">Detect    ∝  lines/day — billions.  CPU only, $0 in tokens.</text><text x="60" y="1142.6" font-family="Helvetica,Arial" font-size="14" fill="#2f9e44" text-anchor="start">React     ∝  signals/day — dozens.  Deterministic, $0 in tokens.</text><text x="60" y="1168.6" font-family="Helvetica,Arial" font-size="14" fill="#6741d9" text-anchor="start">Explain   ∝  unmatched signals/day — a handful.  The only paid path.</text><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1e1e1e"/></marker></defs></svg>